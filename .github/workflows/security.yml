name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

defaults:
  run:
    working-directory: server

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: server
          persist-credentials: false
      - uses: ./server/.github/actions/go-workspace
        with:
          protocol-token: ${{ secrets.PROTOCOL_TOKEN }}

      # Run directly rather than through the action, because the action assumes
      # the module is the repository root and this one sits in server/.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
          govulncheck -tags postgres ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: server
          persist-credentials: false
      - uses: ./server/.github/actions/go-workspace
        with:
          protocol-token: ${{ secrets.PROTOCOL_TOKEN }}

      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      # -no-fail on purpose: gosec is the reporter here, not the gate. The gate
      # is golangci-lint, which runs the same analyser with this repository's
      # configuration and, unlike gosec on its own, honours the //nolint:gosec
      # lines that explain the deliberate cases — binding every interface in
      # the mode whose whole job is to serve the internet, for one. Running
      # gosec bare would fail on those every time, and a check that is always
      # red is a check nobody reads. The SARIF still reaches code scanning, so
      # the findings are visible rather than lost.
      - name: gosec (reports to code scanning; golangci-lint is the gate)
        run: gosec -no-fail -fmt sarif -out gosec.sarif -exclude-dir=testdata ./...
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: server/gosec.sarif

  codeql:
    name: CodeQL (security-extended)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          path: server
          persist-credentials: false
      - uses: ./server/.github/actions/go-workspace
        with:
          protocol-token: ${{ secrets.PROTOCOL_TOKEN }}

      - uses: github/codeql-action/init@v4
        with:
          languages: go
          queries: security-extended
      # Built by hand rather than by autobuild: the module is in server/ and it
      # only resolves through the workspace the step above wrote.
      - run: go build ./...
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:go
